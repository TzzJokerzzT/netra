[package]
name = "netra-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
netra-core.workspace = true
rcgen = "0.14.7"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "logging", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = "1.26.1"
webpki-roots = "1.0.12"

[dev-dependencies]
rcgen = "0.14.7"
rustls-pemfile = "2.2.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
